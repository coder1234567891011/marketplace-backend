openapi: 3.1.0
info:
  title: MTG Marketplace API
  description: 'Buy, sell and collect Magic: The Gathering cards. Endpoints live under /v1; authenticate with a Supabase access
    token as a bearer token.'
  version: 1.0.0
paths:
  /v1/users/me:
    get:
      tags:
      - users
      summary: Read Me
      operationId: read_me_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - users
      summary: Create Me
      operationId: create_me_v1_users_me_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - users
      summary: Update Me
      operationId: update_me_v1_users_me_patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - users
      summary: Delete Me
      operationId: delete_me_v1_users_me_delete
      responses:
        '204':
          description: Successful Response
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /v1/users/{user_id}:
    get:
      tags:
      - users
      summary: Read User
      operationId: read_user_v1_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/addresses:
    get:
      tags:
      - addresses
      summary: List My Addresses
      operationId: list_my_addresses_v1_addresses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressRead'
                title: Response List My Addresses V1 Addresses Get
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - addresses
      summary: Add Address
      operationId: add_address_v1_addresses_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /v1/addresses/{address_id}:
    get:
      tags:
      - addresses
      summary: Read Address
      operationId: read_address_v1_addresses__address_id__get
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Address Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    put:
      tags:
      - addresses
      summary: Replace Address
      operationId: replace_address_v1_addresses__address_id__put
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Address Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - addresses
      summary: Remove Address
      operationId: remove_address_v1_addresses__address_id__delete
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Address Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /v1/cards/autocomplete:
    get:
      tags:
      - cards
      summary: Autocomplete
      description: 'Card names for a search box: substring and typo-tolerant, one per card.'
      operationId: autocomplete_v1_cards_autocomplete_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardName'
                title: Response Autocomplete V1 Cards Autocomplete Get
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/cards/search:
    get:
      tags:
      - cards
      summary: Search
      description: Printings matching every given filter, sorted by name.
      operationId: search_v1_cards_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Part of the card name
          title: Q
        description: Part of the card name
      - name: set
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          description: Set code, e.g. m10
          title: Set
        description: Set code, e.g. m10
      - name: rarity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 20
          - type: 'null'
          description: common, uncommon, rare, mythic, …
          title: Rarity
        description: common, uncommon, rare, mythic, …
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Part of the type line, e.g. Creature
          title: Type
        description: Part of the type line, e.g. Creature
      - name: colors
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[WUBRGwubrg]{1,5}$
          - type: 'null'
          description: Color identity includes all of these, e.g. UR
          title: Colors
        description: Color identity includes all of these, e.g. UR
      - name: finish
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - nonfoil
            - foil
            - etched
            type: string
          - type: 'null'
          title: Finish
      - name: lang
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 5
          - type: 'null'
          description: Language code, e.g. en, ja
          title: Lang
        description: Language code, e.g. en, ja
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_CardDetail_'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/cards/oracle/{oracle_id}/printings:
    get:
      tags:
      - cards
      summary: Printings
      description: Every printing of one card (all sets and languages), newest first.
      operationId: printings_v1_cards_oracle__oracle_id__printings_get
      parameters:
      - name: oracle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Oracle Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_CardDetail_'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/cards/{card_id}:
    get:
      tags:
      - cards
      summary: Read Card
      description: One printing, with its marketplace prices and Scryfall's reference prices.
      operationId: read_card_v1_cards__card_id__get
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Card Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardWithPrices'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/cards/{card_id}/sales:
    get:
      tags:
      - cards
      summary: Recent Sales
      description: Recent sales on the marketplace, newest first.
      operationId: recent_sales_v1_cards__card_id__sales_get
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Card Id
      - name: finish
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CardFinish'
          - type: 'null'
          title: Finish
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 5
          - type: 'null'
          description: Language code, e.g. en, ja
          title: Language
        description: Language code, e.g. en, ja
      - name: condition
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CardCondition'
          - type: 'null'
          title: Condition
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleRead'
                title: Response Recent Sales V1 Cards  Card Id  Sales Get
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/cards/{card_id}/price-history:
    get:
      tags:
      - cards
      summary: Price History
      description: 'NM market price changes over the last days. Each point holds until the

        next; the first is the price when the period began.'
      operationId: price_history_v1_cards__card_id__price_history_get
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Card Id
      - name: finish
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CardFinish'
          default: nonfoil
      - name: language
        in: query
        required: false
        schema:
          type: string
          maxLength: 5
          default: en
          title: Language
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 730
          minimum: 7
          default: 90
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PricePoint'
                title: Response Price History V1 Cards  Card Id  Price History Get
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/cards/{card_id}/suggested-price:
    get:
      tags:
      - cards
      summary: Suggested Price
      description: A starting price for a listing of this card.
      operationId: suggested_price_v1_cards__card_id__suggested_price_get
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Card Id
      - name: condition
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CardCondition'
          default: NM
      - name: finish
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CardFinish'
          default: nonfoil
      - name: language
        in: query
        required: false
        schema:
          type: string
          maxLength: 5
          default: en
          title: Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestedPrice'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/collections/user/{user_id}:
    get:
      tags:
      - collections
      summary: List User Collections
      operationId: list_user_collections_v1_collections_user__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionRead'
                title: Response List User Collections V1 Collections User  User Id  Get
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      - {}
  /v1/collections/{collection_id}:
    get:
      tags:
      - collections
      summary: Read Collection
      operationId: read_collection_v1_collections__collection_id__get
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      - {}
    patch:
      tags:
      - collections
      summary: Edit Collection
      operationId: edit_collection_v1_collections__collection_id__patch
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    delete:
      tags:
      - collections
      summary: Remove Collection
      operationId: remove_collection_v1_collections__collection_id__delete
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /v1/collections:
    post:
      tags:
      - collections
      summary: Add Collection
      operationId: add_collection_v1_collections_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionRead'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /v1/collections/{collection_id}/items:
    get:
      tags:
      - collections
      summary: List Collection Items
      operationId: list_collection_items_v1_collections__collection_id__items_get
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_CollectionItemRead_'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      - {}
    post:
      tags:
      - collections
      summary: Add Collection Items
      operationId: add_collection_items_v1_collections__collection_id__items_post
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CollectionItemCreate'
              minItems: 1
              maxItems: 500
              title: Requests
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionItemRead'
                title: Response Add Collection Items V1 Collections  Collection Id  Items Post
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        4XX:
          description: Error (see Error.code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
  /v1/collections/{collection_id}/import:
    post:
      tags:
      - collections
      summary: Import Items
      description: 'Add cards from a pasted decklist or CSV export. Lines that can''t be

        matched are listed in `unmatched`; the rest are added (unless dry_run).'
      operationId: import_items_v1_collections__collection_id__import_post
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          description: Match the lines and report, without adding anything
          default: false
          title: Dry Run
        description: Match the lines and report, without adding anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionImport'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
