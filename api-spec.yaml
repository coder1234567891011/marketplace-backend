components:
  schemas:
    AccountStatus:
      type: string
      enum:
      - active
      - suspended
      - banned
      title: AccountStatus
    AddressCreate:
      properties:
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        recipient_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Recipient Name
        line1:
          type: string
          title: Line1
        line2:
          anyOf:
          - type: string
          - type: 'null'
          title: Line2
        city:
          type: string
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        postal_code:
          type: string
          title: Postal Code
        country:
          type: string
          title: Country
        is_default:
          type: boolean
          title: Is Default
          default: false
      type: object
      required:
      - line1
      - city
      - postal_code
      - country
      title: AddressCreate
    AddressRead:
      properties:
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        recipient_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Recipient Name
        line1:
          type: string
          title: Line1
        line2:
          anyOf:
          - type: string
          - type: 'null'
          title: Line2
        city:
          type: string
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        postal_code:
          type: string
          title: Postal Code
        country:
          type: string
          title: Country
        is_default:
          type: boolean
          title: Is Default
          default: false
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - line1
      - city
      - postal_code
      - country
      - id
      - user_id
      - created_at
      title: AddressRead
    CardCondition:
      type: string
      enum:
      - NM
      - LP
      - MP
      - HP
      - DMG
      title: CardCondition
    CardDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        oracle_id:
          type: string
          format: uuid
          title: Oracle Id
        name:
          type: string
          title: Name
        set_code:
          type: string
          title: Set Code
        set_name:
          type: string
          title: Set Name
        set_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Set Type
        collector_number:
          type: string
          title: Collector Number
        lang:
          type: string
          title: Lang
        released_at:
          type: string
          format: date
          title: Released At
        rarity:
          anyOf:
          - type: string
          - type: 'null'
          title: Rarity
        promo:
          type: boolean
          title: Promo
          default: false
        layout:
          type: string
          title: Layout
        mana_cost:
          anyOf:
          - type: string
          - type: 'null'
          title: Mana Cost
        cmc:
          anyOf:
          - type: number
          - type: 'null'
          title: Cmc
        type_line:
          anyOf:
          - type: string
          - type: 'null'
          title: Type Line
        oracle_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Oracle Text
        colors:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Colors
        color_identity:
          items:
            type: string
          type: array
          title: Color Identity
        finishes:
          items:
            type: string
          type: array
          title: Finishes
        image_uris:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Image Uris
        card_faces:
          anyOf:
          - items:
              $ref: '#/components/schemas/CardFace'
            type: array
          - type: 'null'
          title: Card Faces
        reference_prices:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Reference Prices
      type: object
      required:
      - id
      - oracle_id
      - name
      - set_code
      - set_name
      - collector_number
      - lang
      - released_at
      - rarity
      - layout
      - mana_cost
      - cmc
      - type_line
      - oracle_text
      - colors
      - color_identity
      - finishes
      - image_uris
      - card_faces
