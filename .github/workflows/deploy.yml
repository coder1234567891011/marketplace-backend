# Test, then build and deploy the API to Cloud Run on every push to main.
#
# Authentication is keyless (Workload Identity Federation): GitHub's OIDC
# token is exchanged for a short-lived login as the github-deployer service
# account. One-time setup, which prints the variables below (stored on the
# "production" environment):
#   GCP_PROJECT=<project-id> ./deploy/github-deploy-setup.sh
#
# Database migrations run before the new image is built, so a failed
# migration stops the deploy and the old revision keeps serving. They need the
# DATABASE_URL secret on the "production" environment (the Scryfall sync uses
# it too). Migrations run while the old revision is still live, so they must
# be backward compatible: add columns and tables first, drop them in a later
# release.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # GCP_* variables live on the "production" environment (Settings →
    # Environments), so the job must name it to see them.
    environment: production
    permissions:
      contents: read
      id-token: write  # lets the job request GitHub's OIDC token
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Migrate database
        working-directory: src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic current

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build, push and deploy
        run: ./deploy/cloudrun-deploy.sh
