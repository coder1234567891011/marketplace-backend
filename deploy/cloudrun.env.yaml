# Non-secret environment variables for the Cloud Run service.
# Secrets (DATABASE_URL, SENTRY_DSN, STRIPE_*) live in Secret Manager; see cloudrun-setup.sh.
ENVIRONMENT: production
# Supabase project ref (also visible in the project URL; not a secret).
SUPABASE_PROJECT_REF: cjknmfzthsuhgfpocxef
# Browser origins allowed to call the API. Replace the placeholder with the
# deployed web frontend's URL once it has one.
CORS_ORIGINS: https://YOUR-FRONTEND-DOMAIN.example,http://localhost:8081
# Google's front end appends the real client IP as the last X-Forwarded-For entry.
CLIENT_IP_SOURCE: x-forwarded-for
FORWARDED_FOR_HOPS: "1"
DB_POOL_SIZE: "5"
# The web app, where Stripe sends buyers and sellers back to. Placeholder.
FRONTEND_URL: https://YOUR-FRONTEND-DOMAIN.example
# Marketplace terms: PLACEHOLDERS, to be finalized before launch (README,
# "Before launch"). Orders keep the terms they were placed under.
PLATFORM_FEE_PERCENT: "5"
PLATFORM_FEE_FIXED_CENTS: "0"
PLATFORM_FEE_MIN_CENTS: "0"
CHECKOUT_HOLD_MINUTES: "30"
PAYOUT_ON: shipped
