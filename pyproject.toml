[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]  # (str, Enum) classes are kept for SQLAlchemy/pydantic compatibility

[tool.ruff.lint.per-file-ignores]
"src/migrations/versions/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true
exclude = ["src/migrations/versions/"]
