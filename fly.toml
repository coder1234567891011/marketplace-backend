# fly.toml app configuration file generated for marketplace-backend-2rvpza on 2026-08-12T13:53:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'marketplace-backend-2rvpza'
primary_region = 'iad'

[build]

[env]
  ENVIRONMENT = 'production'
  CLIENT_IP_SOURCE = 'fly'
  # Browser origins allowed to call the API (comma-separated). The deployed
  # web frontend URL is a placeholder: replace it once the site has a domain.
  CORS_ORIGINS = 'https://YOUR-FRONTEND-DOMAIN.example,http://localhost:8081'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm: no cold starts, and the in-memory rate limits
  # stay accurate (they're per machine).
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
